<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardVault</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f4f6;color:#17181b}.app{max-width:1050px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;padding:15px 18px 12px;background:#f4f4f6ee;backdrop-filter:blur(14px);border-bottom:1px solid #ddd}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:23px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;background:#e8e8eb}.primary{background:#111;color:#fff}.search{width:100%;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.tabs{display:flex;gap:8px;padding:14px 18px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:#111;color:#fff}.content{padding:0 18px 80px}.head{display:flex;justify-content:space-between;align-items:end;margin:15px 0}.muted{color:#73767d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#ddd;box-shadow:0 2px 8px #0001}.card.drag{opacity:.4}.card img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:7px;left:7px;background:#000b;color:#fff;border-radius:7px;padding:4px 7px;font-size:10px}.actions{position:absolute;bottom:6px;left:6px;right:6px;display:flex;gap:5px}.actions button{flex:1;padding:7px;border:0;border-radius:8px;background:#fffffff2;font-size:11px;font-weight:800}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.player{border:1px solid #ddd;background:#fff;border-radius:15px;padding:14px;text-align:left}.avatar{width:42px;height:42px;border-radius:12px;background:#e7e7ea;display:grid;place-items:center;font-weight:800;margin-bottom:9px}.player small{color:#73767d}.fab{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;background:#111;color:#fff;padding:14px 18px;font-weight:800;box-shadow:0 7px 25px #0003}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:35px;height:35px;background:#eee;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:#73767d;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.full{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:18px}.preview{min-height:400px;background:#17181b;border-radius:15px;display:grid;place-items:center;padding:15px}.preview img{max-width:100%;max-height:450px;border-radius:8px}.control{border-bottom:1px solid #eee;padding:9px 0}.control label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.control input{width:100%;accent-color:#111}.crop{margin:10px 0;background:#ddd;height:110px;border-radius:10px;overflow:hidden;position:relative}.crop img{width:100%;height:100%;object-fit:cover}.crop:after{content:"";position:absolute;left:18%;top:7%;width:64%;height:86%;border:2px solid white;box-shadow:0 0 0 999px #0005}.detailimg{display:block;width:min(330px,100%);aspect-ratio:3/4;object-fit:cover;margin:12px auto;border-radius:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{padding:10px;background:#f5f5f7;border-radius:10px}.meta b{display:block;font-size:11px;color:#73767d;margin-bottom:3px}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.editor,.fields{grid-template-columns:1fr}.full{grid-column:auto}.preview{min-height:300px}}@media(max-width:430px){.grid{gap:7px}.content,.tabs{padding-left:12px;padding-right:12px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><h1>CardVault</h1><button class="btn primary" onclick="addCard()">＋ Add Card</button></div><input id="search" class="search" placeholder="Search players, teams or sets" oninput="render()"></header><div class="tabs"><button id="all" class="tab active" onclick="view='all';render()">All Cards</button><button id="players" class="tab" onclick="view='players';render()">Players</button></div><main id="content" class="content"></main></div><button class="fab" onclick="addCard()">＋ Card</button>
<div id="form" class="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Add card</h2><button class="close" onclick="hide('form')">×</button></div><div class="fields"><div class="field"><label>Player</label><input id="player"></div><div class="field"><label>Team</label><input id="team"></div><div class="field"><label>Year / Set</label><input id="set"></div><div class="field"><label>Card #</label><input id="num"></div><div class="field"><label>Type</label><select id="type"><option>Standard</option><option>Rookie</option><option>Numbered</option><option>Autograph</option><option>Relic</option></select></div><div class="field"><label>Serial / Parallel</label><input id="serial"></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div><div class="field"><label>Front photo</label><input id="frontFile" type="file" accept="image/*" onchange="photo(this,'front')"></div><div class="field"><label>Back photo</label><input id="backFile" type="file" accept="image/*" onchange="photo(this,'back')"></div></div><div class="row"><button class="btn" onclick="openEditor('front')">Edit front</button><button class="btn" onclick="openEditor('back')">Edit back</button><button class="btn primary" onclick="saveCard()">Save card</button></div></div></div>
<div id="editor" class="modal"><div class="sheet"><div class="sheethead"><h2>Photo editor</h2><button class="close" onclick="hide('editor')">×</button></div><div class="editor"><div><div class="preview"><img id="ep"></div><div class="muted" style="margin-top:8px">Crop preview · 3:4 card ratio</div><div class="crop"><img id="ct"></div></div><div><div class="row"><button class="btn" onclick="side='front';refreshEditor()">Front</button><button class="btn" onclick="side='back';refreshEditor()">Back</button></div><div id="controls"></div><div class="row"><button class="btn" onclick="rotate()">↻ Rotate</button><button class="btn" onclick="resetEdit()">Reset</button><button class="btn primary" onclick="applyEdit()">Apply changes</button></div></div></div></div></div>
<div id="detail" class="modal"><div class="sheet"><div class="sheethead"><h2 id="dt"></h2><button class="close" onclick="hide('detail')">×</button></div><img id="di" class="detailimg"><div id="meta" class="meta"></div><div class="row"><button class="btn" onclick="toggleBack()">Show back</button><button class="btn primary" onclick="editCard()">Edit card</button></div></div></div>
<script>
const sample=(n,t,y)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="600" height="800" rx="30" fill="#202124"/><rect x="25" y="25" width="550" height="750" rx="20" fill="none" stroke="white" opacity=".5"/><circle cx="300" cy="330" r="130" fill="white" opacity=".14"/><text x="300" y="350" text-anchor="middle" fill="white" font-family="Arial" font-size="46" font-weight="bold">${n.split(' ').map(x=>x[0]).join('')}</text><text x="300" y="555" text-anchor="middle" fill="white" font-family="Arial" font-size="34" font-weight="bold">${n}</text><text x="300" y="600" text-anchor="middle" fill="white" font-family="Arial" font-size="22">${t}</text><text x="50" y="90" fill="white" font-family="Arial" font-size="25">${y}</text></svg>`);
let cards=[['Michael Jordan','Chicago Bulls','1997 Metal Universe','12','Standard'],['LeBron James','Los Angeles Lakers','2020 Prizm','1','Standard'],['Luka Doncic','Dallas Mavericks','2018 Prizm','280','Rookie'],['Shohei Ohtani','LA Dodgers','2024 Chrome','150','Numbered'],['Patrick Mahomes','Kansas City Chiefs','2023 Prizm','45','Standard'],['Victor Wembanyama','San Antonio Spurs','2023 Prizm','136','Rookie']].map((a,i)=>({id:i+1,player:a[0],team:a[1],set:a[2],num:a[3],type:a[4],serial:'',notes:'',front:sample(a[0],a[1],a[2].slice(0,4)),back:sample(a[0]+' back',a[1],a[2].slice(0,4)),order:i}));
try{cards=JSON.parse(localStorage.cardvault)||cards}catch(e){}let view='all',editing=null,side='front',working={front:null,back:null},detailSide='front',rotation=0;const $=id=>document.getElementById(id);function hide(id){$(id).classList.remove('show')}function show(id){$(id).classList.add('show')}
function render(){let q=$('search').value.toLowerCase();$('all').classList.toggle('active',view==='all');$('players').classList.toggle('active',view==='players');if(view==='players'){let p=[...new Set(cards.map(x=>x.player))].filter(x=>x.toLowerCase().includes(q));$('content').innerHTML='<div class="head"><div><h2>Players</h2><div class="muted">'+p.length+' players</div></div></div><div class="players">'+p.map(x=>`<button class="player" onclick="filterPlayer(${JSON.stringify(x)})"><div class="avatar">${x.split(' ').map(y=>y[0]).join('').slice(0,2)}</div><b>${x}</b><br><small>${cards.filter(c=>c.player===x).length} cards</small></button>`).join('')+'</div>';return}let list=cards.filter(c=>(c.player+' '+c.team+' '+c.set).toLowerCase().includes(q)).sort((a,b)=>a.order-b.order);$('content').innerHTML='<div class="head"><div><h2>All Cards</h2><div class="muted">'+list.length+' cards · drag to reorder</div></div></div><div id="grid" class="grid">'+list.map(c=>`<div class="card" draggable="true" data-id="${c.id}"><img src="${c.front}"><span class="badge">${c.type}</span><div class="actions"><button onclick="openEditorFor(${c.id})">Edit</button><button onclick="openDetail(${c.id})">Details</button></div></div>`).join('')+'</div>';document.querySelectorAll('.card').forEach(el=>{el.ondragstart=()=>el.classList.add('drag');el.ondragend=()=>{el.classList.remove('drag');saveOrder()};el.ondragover=e=>{e.preventDefault();let d=document.querySelector('.drag');if(d&&d!==el){let r=el.getBoundingClientRect();el.parentNode.insertBefore(d,e.clientX<r.left+r.width/2?el:el.nextSibling)}}})}
function filterPlayer(p){$('search').value=p;view='all';render()}function addCard(){editing=null;working={front:null,back:null};$('formTitle').textContent='Add card';['player','team','set','num','serial','notes'].forEach(x=>$(x).value='');$('type').value='Standard';show('form')}function openEditorFor(id){editing=cards.find(c=>c.id===id);working={front:editing.front,back:editing.back};openEditor('front')}function openEditor(s){side=s;rotation=0;refreshEditor();hide('form');show('editor')}function photo(input,s){let r=new FileReader();r.onload=()=>{working[s]=r.result};r.readAsDataURL(input.files[0])}
const names=[['bright','Brightness',-100,100],['contrast','Contrast',-100,100],['sat','Saturation',-100,100],['sharp','Sharpness',0,100],['exp','Exposure',-100,100],['high','Highlights',-100,100],['shadow','Shadows',-100,100],['bw','Black & white',0,100]];let vals={bright:0,contrast:0,sat:0,sharp:0,exp:0,high:0,shadow:0,bw:0};function refreshEditor(){if(!working[side])working[side]=sample('No photo','Add a photo','—');$('ep').src=working[side];$('ct').src=working[side];$('controls').innerHTML=names.map(n=>`<div class="control"><label>${n[1]} <span id="v${n[0]}">${vals[n[0]]}</span></label><input id="r${n[0]}" type="range" min="${n[2]}" max="${n[3]}" value="${vals[n[0]]}" oninput="vals.${n[0]}=+this.value;updateFilter()"></div>`).join('');updateFilter()}function updateFilter(){names.forEach(n=>{let x=$('v'+n[0]);if(x)x.textContent=vals[n[0]]});let b=1+(vals.bright+vals.exp*.55)/100,c=1+vals.contrast/100,s=1+vals.sat/100,g=vals.bw/100,bl=Math.max(0,2-vals.sharp*.02);$('ep').style.filter=`brightness(${b}) contrast(${c}) saturate(${s}) grayscale(${g}) blur(${bl}px)`;$('ep').style.transform=`rotate(${rotation}deg)`}function rotate(){rotation=(rotation+90)%360;updateFilter()}function resetEdit(){names.forEach(n=>vals[n[0]]=0);rotation=0;refreshEditor()}function applyEdit(){working[side]=$('ep').src;if(editing){editing.front=working.front;editing.back=working.back;persist();render()}hide('editor');show('form')}
function saveCard(){let c=editing||{id:Date.now(),order:cards.length};c.player=$('player').value||'Unknown player';c.team=$('team').value;c.set=$('set').value;c.num=$('num').value;c.type=$('type').value;c.serial=$('serial').value;c.notes=$('notes').value;c.front=working.front||c.front||sample(c.player,c.team,'2026');c.back=working.back||c.back||c.front;if(!editing)cards.push(c);persist();hide('form');render()}function persist(){localStorage.cardvault=JSON.stringify(cards)}
function openDetail(id){editing=cards.find(c=>c.id===id);detailSide='front';$('dt').textContent=editing.player;$('di').src=editing.front;$('meta').innerHTML=[['Team',editing.team],['Year / Set',editing.set],['Card #',editing.num],['Type',editing.type],['Serial / Parallel',editing.serial||'—'],['Notes',editing.notes||'—']].map(x=>`<div><b>${x[0]}</b>${x[1]||'—'}</div>`).join('');show('detail')}function toggleBack(){detailSide=detailSide==='front'?'back':'front';$('di').src=editing[detailSide]}function editCard(){hide('detail');working={front:editing.front,back:editing.back};['player','team','set','num','serial','notes'].forEach((x,i)=>$(x).value=[editing.player,editing.team,editing.set,editing.num,editing.serial,editing.notes][i]);$('type').value=editing.type;$('formTitle').textContent='Edit card';show('form')}function saveOrder(){document.querySelectorAll('.card').forEach((e,i)=>{let c=cards.find(x=>x.id==e.dataset.id);if(c)c.order=i});persist()}render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
</body></html>
